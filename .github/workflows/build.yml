name: Build RootHide package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install RootHide Theos and iOS SDK
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Build package
        run: make clean package FINALPACKAGE=1

      - name: Save the .deb package
        uses: actions/upload-artifact@v4
        with:
          name: LiveTextEnabler-deb
          path: packages/*.deb
          if-no-files-found: error
